# Combined deployment: epithet --config examples/inventory-scim.example.yaml server
# Replace keys, paths, provider/client IDs, and token before use.
# Both keys are persistent and provisioned by the operator, never auto-generated.
server:
  listen: '127.0.0.1:8080'
  ca-key: /etc/epithet/ca.key
  control-key: /etc/epithet/control.key
ca:
  policy-file: /etc/epithet/policy.writ
  oidc:
    issuer: https://identity.example.com
    client-id: epithet
    identity-mode: stable-id
    # Pocket ID uses sub by default; no user-id-claim override is needed.
directory:
  source: scim
  # SCIM storage: <state-dir>/directory/directory.db.
  # state-dir: /custom/state
control:
  # Keep the existing random provisioning bearer token. Choose one form.
  scim-token: REPLACE_WITH_YOUR_PROVISIONING_TOKEN
  # scim-token-file: /etc/epithet/scim.token
  # Each grant requires a provisioned, active user. These roles are independent.
  directory-admin-user: [YOUR_POCKET_ID_USER_ID]
  inventory-admin-user: [YOUR_POCKET_ID_USER_ID]
  # directory-admin-group: [directory-operators]
  # inventory-admin-group: [host-operators]
inventory:
  static: [/etc/epithet/hosts.yaml]
  # Host storage: <state-dir>/inventory/records. Native system defaults apply.
  # state-dir: /custom/state
  # inventory-source: managed  # Default; static disables managed hosts only.
  # principal-mode: epithet-principal-v1  # Default; static hosts require domains.

# Independently supervised services additionally configure:
# ca: directory, inventory, key, listen, control-public-url
# control: key, listen, oidc, directory, directory-backend, inventory-backend
# directory / inventory: ca-pubkey, control-pubkey, listen
# See docs/inventory.md. Backend endpoints stay private.
