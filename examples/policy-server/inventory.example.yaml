# Example static inventory: SCIM-shaped users, labeled hosts.
#
# The OIDC identity (email claim, falling back to sub) is compared
# byte-for-byte against userName. A user absent from this file, or with
# active: false, is denied structurally - no policy rule can grant it
# anything. Field names follow SCIM (RFC 7643).

users:
  - userName: alice@example.com
    groups: [Admins, Developers]
    userType: employee
  - userName: bob@example.com
    groups: [Developers]
    userType: employee
  - userName: carol@example.com
    groups: [Operations]
    userType: employee
  - userName: dave@contractor.example.com
    groups: [Developers]
    userType: contractor

# Human-readable domains must be declared before host entries can reference
# them. This catches misspellings instead of silently creating a new fleet.
domains:
  - dev-fleet

hosts:
  # Exact entries: one host each. Names are matched case-insensitively.
  - name: prod-web-1.example.com
    labels: {env: prod, role: web}
    # For destination binding, set principal-mode: epithet-principal-v1 and copy
    # the domain printed by `epithet host enroll`:
    # principal-mode: epithet-principal-v1
    # domain: "epithet-host-id-v1:..."
  - name: prod-db-1.example.com
    labels: {env: prod, role: db}
    # Optional account grounding: certs are only issuable for accounts
    # listed here, no matter what the policy says. Omit the key to let
    # rules match the requested account directly.
    accounts: [root, postgres, ubuntu]

  # Pattern entries synthesize a host for any matching name - useful
  # for short-lived fleets that follow a naming convention. Inventory and
  # Writ share host globs: * and ? stay within one dot-delimited label, while
  # a whole-label ** crosses zero or more labels.
  - pattern: "dev-*.example.com"
    labels: {env: dev}
    principal-mode: epithet-principal-v1
    domain: dev-fleet
