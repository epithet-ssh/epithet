version: '3.8'

services:
  policy:
    image: epithet:latest
    container_name: epithet-policy
    command: >
      --config /config/policy.yaml
      policy
      --ca-pubkey "$$(cat /config/ca_key.pub)"
      --listen 0.0.0.0:9999
    volumes:
      - ./config:/config:ro
    ports:
      - "9999:9999"
    restart: unless-stopped
    networks:
      - epithet
    healthcheck:
      # There is no /health route, and every other route on the policy
      # server requires a CA-minted service JWT (every request 401s without
      # one), so an HTTP check can't distinguish "up" from "down" here. A
      # raw TCP connect is the honest check: it only confirms something is
      # listening on the port.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9999"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ca:
    image: epithet:latest
    container_name: epithet-ca
    command: >
      ca
      --key /config/ca_key
      --policy http://policy:9999
      --listen :8080
    volumes:
      - ./config:/config:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      policy:
        condition: service_healthy
    networks:
      - epithet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  epithet:
    driver: bridge
