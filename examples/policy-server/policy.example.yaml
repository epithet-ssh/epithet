# Epithet Policy Server - Inline Configuration Example
#
# Use this format for configuration in ~/.epithet/*.yaml files.
# The "policy:" wrapper is required because Kong resolves config by subcommand name.
#
# Each issued certificate carries exactly one principal: the SSH username the
# client actually requested (ssh <user>@<host>). There is no union of
# principals and no group-name indirection - the keys under "allow" below
# must be real login usernames on the target hosts (root, deploy, alice),
# not role or group labels.

policy:
  # CA public key for signature verification
  # Get this from your CA server: curl http://localhost:8080/
  # Or from the file: cat ca_key.pub
  ca-pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAbCdE..."

  # OIDC configuration for token validation
  # Examples:
  #   Google: issuer: https://accounts.google.com
  #   Okta: issuer: https://your-domain.okta.com
  #   Azure AD: issuer: https://login.microsoftonline.com/{tenant-id}/v2.0
  oidc:
    issuer: "https://accounts.google.com"
    client-id: "your-client-id"  # Required - audience checking can never be silently skipped

  # Map users (by email or OIDC sub claim) to tags
  # Tags represent roles or team membership
  users:
    alice@example.com: [admin, eng] # Senior engineer with admin access
    bob@example.com: [eng] # Engineer
    charlie@example.com: [ops] # Operations team
    diana@example.com: [admin, ops] # Ops lead with admin access

    # Add your team members here:
    # yourname@example.com: [admin]

  # Global defaults for all hosts (unless overridden per-host)
  defaults:
    # Map SSH login usernames to the tags allowed to log in as that user.
    # A user needs at least one matching tag to be authorized for the
    # requested username; the issued cert then names only that one username.
    allow:
      root: [admin] # Only admins may log in as root
      ubuntu: [admin, eng] # Admins and engineers may log in as ubuntu
      deploy: [admin, ops] # Admins and ops may log in as deploy

    # Default certificate expiration (2-10 minutes recommended)
    expiration: "5m"

    # Default SSH certificate extensions
    extensions:
      permit-pty: ""
      permit-agent-forwarding: ""
      permit-user-rc: ""

  # Per-host policy overrides (optional)
  # Use this to authorize additional usernames on specific hosts, or to
  # override expiration/extensions for them.
  hosts:
    # Production database - only admins may log in as postgres
    prod-db-01:
      allow:
        postgres: [admin]
      expiration: "2m" # Shorter expiration for production database

    # Development server - engineers get an additional login
    dev-server:
      allow:
        builder: [eng] # Engineers may log in as "builder"
      expiration: "10m" # Longer expiration for development

    # Staging environment
    staging-api:
      allow:
        deployer: [ops, eng] # Both ops and eng may log in as deployer
      expiration: "5m"

# Certificate principal examples:
#
# alice@example.com (tags: [admin, eng]) can request certificates for:
#   root       (global default: admin)
#   ubuntu     (global default: admin or eng)
#   deploy     (global default: admin or ops)
#   postgres   (prod-db-01 override: admin)
#   builder    (dev-server override: eng)
#   deployer   (staging-api override: ops or eng)
# Each `ssh <user>@<host>` request gets its own certificate naming only that
# one username - never a bundle of everything alice could reach.
#
# bob@example.com (tags: [eng]) can request:
#   ubuntu, builder, deployer - but not root, deploy, or postgres.
#
# charlie@example.com (tags: [ops]) can request:
#   deploy, deployer - but not root, ubuntu, postgres, or builder.

# Target host setup
#
# Since the certificate's principal is exactly the requested login username,
# sshd's default principal matching is enough - no AuthorizedPrincipalsFile
# is required. On each SSH server, configure /etc/ssh/sshd_config:
#
#   TrustedUserCAKeys /etc/ssh/ca/epithet.pub
#
# With only TrustedUserCAKeys set, sshd accepts a certificate for user X
# logging in as X if the certificate names X as a principal - which is
# exactly what this policy server issues. AuthorizedPrincipalsFile is only
# needed if you want a *different* mapping (e.g. one certificate principal
# authorizing several local accounts); most deployments don't need it.
#
# Now when alice (tags [admin, eng]) runs:
#   ssh root@server        → Allowed (alice has 'admin', root's allow list)
#   ssh ubuntu@server      → Allowed (alice has 'admin' or 'eng')
#   ssh postgres@prod-db-01 → Allowed (alice has 'admin')
#
# And when bob (tags [eng]) runs:
#   ssh root@server        → Denied (root requires 'admin', bob only has 'eng')
#   ssh ubuntu@server      → Allowed (bob has 'eng')
#   ssh postgres@prod-db-01 → Denied (postgres requires 'admin')

# Security notes:
#
# 1. Certificates can be used on ANY host that trusts the CA, regardless of
#    host-specific policies in this config. Host restrictions are enforced
#    at certificate ISSUANCE time, not validation time.
#
# 2. Use sshd's AuthorizedPrincipalsCommand on target hosts for additional
#    enforcement beyond principal matching, if needed.
#
# 3. Keep certificate expiration short (2-10 minutes). This minimizes the
#    blast radius if a certificate is compromised. Users remain authenticated
#    via OIDC refresh tokens, so re-authentication is fast (~100-200ms).
#
# 4. Each certificate names exactly the one username actually requested for
#    that connection - never a union of everything the user is authorized
#    for elsewhere in this config.
