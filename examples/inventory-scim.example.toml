# Combined deployment: epithet --config examples/inventory-scim.example.toml server
# Replace keys, paths, provider/client IDs, and token before use.
# Both keys are persistent and provisioned by the operator, never auto-generated.
listen = "127.0.0.1:8080"
ca-key-file = "/etc/epithet/ca.key"
control-key-file = "/etc/epithet/control.key"
policy-file = "/etc/epithet/policy.writ"

oidc-issuer = "https://identity.example.com"
oidc-client-id = "epithet"
oidc-identity-mode = "stable-id"
# Pocket ID uses sub by default; no oidc-user-id-claim override is needed.

directory-mode = "scim"
inventory-mode = "enrollment"
# Shared storage root; native system defaults apply.
# SCIM uses <state-dir>/directory/directory.db; hosts use <state-dir>/inventory/records.
# state-dir = "/custom/state"

# Choose one form of provisioning token:
scim-token = "REPLACE_WITH_YOUR_PROVISIONING_TOKEN"
# scim-token-file = "/etc/epithet/scim.token"

# Each grant requires a provisioned, active user. These roles are independent.
directory-admin-user = ["YOUR_POCKET_ID_USER_ID"]
inventory-admin-user = ["YOUR_POCKET_ID_USER_ID"]
# directory-admin-group = ["directory-operators"]
# inventory-admin-group = ["host-operators"]

# Optional static hosts alongside enrolled hosts:
# inventory-static-file = ["/etc/epithet/hosts.yaml"]
# principal-mode = "epithet-principal-v1" # Default; static hosts require domains.

# Independently supervised services use separate flat files when values differ.
# CA additionally needs directory, inventory, and control-public endpoints.
# Control needs directory, directory-backend, and inventory-backend endpoints.
# Directory and inventory need ca-public-key and control-public-key.
# See docs/inventory.md. Backend endpoints stay private.
