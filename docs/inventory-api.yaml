openapi: 3.0.3
info:
  title: Epithet Inventory Fact API
  version: 1.0.0
  description: >-
    A single active-object lookup, independent of control-plane APIs. Responses
    are limited to 64 KiB and all responses must include Cache-Control no-store.
    Requests have exactly one query parameter and no body. The client appends
    /lookup to the configured service root. See fact-services.md.
paths:
  /lookup:
    get:
      operationId: lookupInventory
      security: [{ServiceJWT: []}]
      parameters:
        - in: query
          name: host
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Active Host; never null
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Host'}
        '400': {description: Invalid lookup request}
        '403': {description: Invalid service authentication}
        '404': {description: Unknown or inactive entity}
        '503': {description: Provider unavailable}
components:
  securitySchemes:
    ServiceJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Request-bound JWT signed with a configured reader key. Audience is
        epithet-inventory. Verify the signature, audience, expiry, issued-at
        freshness, exact HTTP method, authority plus escaped path and raw query,
        and unpadded base64url SHA256 body digest. See pkg/serviceauth.
  schemas:
    Revision:
      type: string
      description: Optional opaque logging metadata, at most 256 UTF-8 bytes; never used for authorization or caching
    Host:
      type: object
      required: [names, accounts, principal]
      properties:
        names:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
          description: All equivalent normalized names, including the requested host; independent of principal realm
        accounts:
          type: array
          nullable: true
          items: {type: string}
          description: Required; null is unrestricted, empty permits none, a list restricts accounts
        labels:
          type: object
          additionalProperties: {type: string}
        principal:
          oneOf:
            - type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [account-name]}
            - type: object
              required: [mode, realm]
              properties:
                mode: {type: string, enum: [epithet-principal-v1]}
                realm:
                  type: string
                  minLength: 1
                  description: Opaque principal realm, not a hostname
        revision: {$ref: '#/components/schemas/Revision'}
