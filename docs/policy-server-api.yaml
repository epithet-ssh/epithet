openapi: 3.0.3
info:
  title: Epithet Policy Server API
  version: 3.0.0
  description: |
    The Policy Server API is called by the Epithet CA to make authorization decisions
    for SSH certificate requests, and to serve the anonymous OIDC bootstrap config the
    CA passes through on its own `/discovery` endpoint. Your policy server receives
    the user's authentication token (always a JWT) and connection details, and returns
    certificate parameters if the request is approved.

    This OpenAPI specification can be used to:
    - Generate server stubs in your preferred language
    - Configure API gateways (AWS API Gateway, Kong, etc.)
    - Validate requests and responses
    - Generate client libraries

    ## Security

    Every request — GET and POST alike — carries a short-lived JWT the CA mints per
    request and signs with its own SSH private key (`pkg/serviceauth`). Your policy
    server MUST verify this token (signature, audience, freshness, body hash, method,
    and target) before processing the request. There is no unauthenticated variant of
    either route.

  contact:
    name: Epithet Project
    url: https://github.com/epithet-ssh/epithet
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://policy.example.com
    description: Your policy server endpoint

paths:
  /:
    get:
      operationId: getDiscovery
      summary: Anonymous OIDC bootstrap config
      description: |
        Called by the CA to populate its own anonymous `GET /discovery` endpoint,
        which clients fetch once at startup to learn how to authenticate. Still
        requires the CA's service JWT (see Security), even though the payload
        itself carries no user secrets — this endpoint has no unauthenticated
        variant in epithet's own implementation.
      security:
        - ServiceJWT: []
      responses:
        '200':
          description: OIDC bootstrap config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
              examples:
                typical:
                  value:
                    auth:
                      issuer: "https://accounts.google.com"
                      client_id: "123456.apps.googleusercontent.com"
        '401':
          description: Invalid or missing service JWT
          content:
            text/plain:
              schema:
                type: string
              example: "request verification failed: token expired"
        '405':
          description: Method not allowed (only GET and POST are supported on this route)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"

    post:
      operationId: evaluatePolicy
      summary: Evaluate certificate request policy
      description: |
        Evaluate whether to approve an SSH certificate request and determine
        the certificate parameters (principals, expiration, extensions).

        The policy server should:
        1. Verify the CA's service JWT (see Security)
        2. Validate the user's token (JWT: signature, issuer, audience, expiry)
        3. Check authorization (can this identity access this host as the requested user?)
        4. Set principals (exactly the one requested user), expiration, notAfter, and extensions

      security:
        - ServiceJWT: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
            examples:
              typical:
                summary: Typical policy request
                value:
                  token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                  connection:
                    remoteHost: "prod-web-01.example.com"
                    remoteUser: "deploy"
                    port: 22
                    proxyJump: ""
                    hash: "a1b2c3d4e5f67890"

      responses:
        '200':
          description: Certificate request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
              examples:
                approved:
                  summary: Approved with standard permissions
                  value:
                    certParams:
                      identity: "alice@example.com"
                      principals: ["deploy"]
                      expiration: 300000000000
                      notAfter: "2026-08-13T18:30:00Z"
                      extensions:
                        permit-pty: ""
                        permit-agent-forwarding: ""

        '400':
          description: Malformed request body (not valid JSON, or the read itself failed)
          content:
            text/plain:
              schema:
                type: string
              example: "Invalid JSON: unexpected end of JSON input"

        '401':
          description: Invalid service JWT, or invalid/expired user token
          content:
            text/plain:
              schema:
                type: string
              example: "Invalid token: token is expired"

        '403':
          description: User not authorized for this access
          content:
            text/plain:
              schema:
                type: string
              example: "User alice not authorized for deploy@prod-web-01.example.com"

        '405':
          description: Method not allowed (only GET and POST are supported on this route)
          content:
            text/plain:
              schema:
                type: string
              example: "Method not allowed"

        '413':
          description: Request body exceeded the 64 KiB limit (`wire.MaxBodySize`)
          content:
            text/plain:
              schema:
                type: string
              example: "Request body too large"

        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
              example: "failed to marshal response: ..."

components:
  schemas:
    Discovery:
      type: object
      properties:
        auth:
          $ref: '#/components/schemas/AuthConfig'

    AuthConfig:
      type: object
      required:
        - issuer
        - client_id
      properties:
        issuer:
          type: string
          description: OIDC issuer URL
          example: "https://accounts.google.com"
        client_id:
          type: string
          description: OAuth2 client ID. Required — audience checking can never be silently skipped.
          example: "123456.apps.googleusercontent.com"
        client_secret:
          type: string
          description: OAuth2 client secret, only present for confidential clients. Omitted (not empty-stringed) when unset.
          example: ""

    PolicyRequest:
      type: object
      required:
        - token
        - connection
      properties:
        token:
          type: string
          description: |
            The user's ID token. Always a JWT, end to end — there is no other
            token shape in epithet.
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

        connection:
          $ref: '#/components/schemas/Connection'

    Connection:
      type: object
      required:
        - remoteHost
        - remoteUser
        - port
        - hash
      properties:
        remoteHost:
          type: string
          description: Target SSH server hostname (OpenSSH %h)
          example: "prod-web-01.example.com"

        remoteUser:
          type: string
          description: |
            Target username on remote server (OpenSSH %r) - the single principal
            being requested. The issued certificate, if approved, names exactly
            this principal and no others.
          example: "deploy"

        port:
          type: integer
          format: uint32
          description: Target SSH port (OpenSSH %p)
          example: 22
          minimum: 1
          maximum: 65535

        proxyJump:
          type: string
          description: ProxyJump configuration (OpenSSH %j), empty string if not used
          example: ""

        hash:
          type: string
          description: |
            OpenSSH %C hash - unique identifier for this connection, computed
            by OpenSSH from the full connection tuple.
          example: "a1b2c3d4e5f67890"

    PolicyResponse:
      type: object
      required:
        - certParams
      properties:
        certParams:
          $ref: '#/components/schemas/CertParams'

    CertParams:
      type: object
      required:
        - identity
        - principals
        - expiration
        - extensions
      properties:
        identity:
          type: string
          description: |
            Certificate identity/key ID used for audit logging and display.
            Typically user email or username.
          example: "alice@example.com"

        principals:
          type: array
          description: |
            The certificate's principals. Epithet's own evaluator always
            returns exactly one entry — the requested connection.remoteUser —
            since certificates are minted per connection and never cached or
            reused across a different host/user pair. A custom policy server
            may return more, but epithet's client-side code never relies on
            more than the one it asked for.
          items:
            type: string
          example: ["deploy"]
          minItems: 1

        expiration:
          type: integer
          format: int64
          description: |
            Certificate validity **in nanoseconds**. This is Go's
            `time.Duration` marshaled by the standard library's default
            `encoding/json` behavior - an integer, not a duration string.
            Recommended: 2-10 minutes (120000000000-600000000000 ns) for
            short-lived certificates that limit exposure if compromised.
          example: 300000000000

        notAfter:
          type: string
          format: date-time
          description: |
            Absolute ceiling on certificate validity (RFC 3339), typically
            derived from the user token's own expiry. The CA signs with
            `min(now + expiration, notAfter)`, so a certificate can never
            outlive the auth session that requested it. Omit (or send the
            zero time) for no additional ceiling beyond `expiration`.
          example: "2026-08-13T18:30:00Z"

        extensions:
          type: object
          description: |
            SSH certificate extensions to grant. Keys are extension names,
            values are typically empty strings. Common extensions:
            - permit-pty: Allow terminal allocation
            - permit-agent-forwarding: Allow SSH agent forwarding
            - permit-port-forwarding: Allow port forwarding
            - permit-user-rc: Allow executing ~/.ssh/rc
            - permit-X11-forwarding: Allow X11 forwarding
          additionalProperties:
            type: string
          example:
            permit-pty: ""
            permit-agent-forwarding: ""
          minProperties: 0

  securitySchemes:
    ServiceJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT the CA mints per request and signs with its own SSH private key,
        sent as `Authorization: Bearer <jwt>`. Claims:

        | Claim | Meaning |
        |---|---|
        | iss | CA identity: SHA256 fingerprint of the CA's SSH public key |
        | aud | `"epithet-policy"` |
        | iat / exp | Issued-at / expiry, ~60 seconds apart |
        | jti | Random token ID |
        | bh | base64url (raw, unpadded) of sha256(request body); empty-string body for GET |
        | htm | HTTP method |
        | htu | Request target: host + path |

        The signing algorithm is derived from the CA's key type
        (ed25519→EdDSA, RSA→PS256, ECDSA→ES256/ES384). `htm`/`htu` binding
        prevents a captured token from being replayed against a different
        method or path that happens to share the same body hash (e.g. an
        empty body on both a GET and a POST). Your implementation MUST
        verify this token — signature, audience, freshness, and body hash —
        before processing any request; there is no unauthenticated mode.

security:
  - ServiceJWT: []
